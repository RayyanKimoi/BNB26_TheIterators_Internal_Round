[pytest]
# Scope collection to this project's own test packages. Without this, a bare
# `pytest` from the root also sweeps ui-ux-pro-max-skill/, a vendored
# third-party skill that ships the same test basenames under both
# cli/assets/scripts/tests/ and src/ui-ux-pro-max/scripts/tests/ with no
# __init__.py, so pytest's rootdir import collides and collection errors
# out before a single Black Box test runs. Its tests are not ours to own.
#
# Replay has no tests/ dir of its own: its suite is backend/tests/test_replay.py,
# since every replay path is exercised through the fork endpoint. And
# backend/test_backend.py is deliberately absent here - it is a standalone
# integration script (`python -m backend.test_backend`), not a pytest module.
testpaths =
    backend/tests
    model/tests
    generator/tests
    ingest/tests

markers =
    slow: exercises the real sentence-transformers encoder
